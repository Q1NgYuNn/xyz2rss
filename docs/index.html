<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小宇宙 → RSS</title>
<style>
  :root { color-scheme: light dark; --bg:#f7f7f8; --card:#fff; --txt:#111; --dim:#8e8e93; --line:#e5e5ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --card:#1c1c1e; --txt:#f2f2f7; --dim:#8e8e93; --line:#3a3a3c; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; padding:20px 18px 48px; background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; -webkit-text-size-adjust:100%; }
  h1 { font-size:23px; margin:6px 0 4px; letter-spacing:-.4px; }
  .sub { color:var(--dim); font-size:13px; line-height:1.6; margin-bottom:22px; }
  .card { background:var(--card); border-radius:14px; padding:16px; margin-bottom:12px;
    box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .feed-title { font-size:16px; font-weight:600; margin-bottom:6px; display:flex;
    align-items:center; gap:8px; flex-wrap:wrap; }
  .tag { font-size:11px; font-weight:500; padding:2px 8px; border-radius:20px;
    background:#e8f5e9; color:#2e7d32; }
  .tag.web { background:#fff3e0; color:#e65100; }
  .meta { font-size:12px; color:var(--dim); margin-bottom:10px; }
  .url { font-size:12px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    background:var(--bg); border-radius:8px; padding:10px; word-break:break-all;
    line-height:1.5; -webkit-user-select:all; user-select:all; border:1px solid var(--line); }
  .row { display:flex; gap:8px; margin-top:10px; }
  button { flex:1; padding:11px; font-size:14px; font-weight:600; border:none;
    border-radius:10px; background:#007aff; color:#fff; cursor:pointer; }
  button.ghost { background:var(--line); color:#007aff; }
  .empty { text-align:center; color:var(--dim); font-size:14px; padding:26px 0; line-height:1.7; }
  .steps { font-size:13px; color:var(--dim); line-height:1.9; margin:0; padding-left:18px; }
  .toast { position:fixed; left:50%; bottom:34px; transform:translateX(-50%) translateY(20px);
    background:rgba(0,0,0,.85); color:#fff; padding:11px 20px; border-radius:22px;
    font-size:14px; opacity:0; transition:.25s; pointer-events:none; white-space:nowrap; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<h1>小宇宙 → RSS</h1>
<div class="sub">已转换的播客。点「复制」后到播客客户端里「通过 URL 添加节目」。</div>

<div id="list"></div>

<div class="card">
  <div class="feed-title">怎么添加新播客</div>
  <ol class="steps">
    <li>在小宇宙里打开播客页，复制链接</li>
    <li>把链接发给我（Minis 对话里即可）</li>
    <li>我转换并发布后，刷新本页就会出现在上面</li>
  </ol>
</div>

<div class="toast" id="toast"></div>

<script>
const BASE = 'https://q1ngyunn.github.io/xyz2rss/';

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 1700);
}

async function copy(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast('已复制');
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    toast('已复制');
  }
}

async function load() {
  const list = document.getElementById('list');
  try {
    const r = await fetch(BASE + 'index.json?t=' + Date.now());
    const d = await r.json();
    const feeds = Object.values(d.feeds || {})
      .sort((a, b) => (b.updated || '').localeCompare(a.updated || ''));

    if (!feeds.length) {
      list.innerHTML = '<div class="card empty">还没有转换过播客<br>把链接发给我即可</div>';
      return;
    }

    list.innerHTML = feeds.map(f => {
      const url = BASE + f.file;
      const tag = f.source === 'official'
        ? `<span class="tag">完整 ${f.episodes} 集</span>`
        : `<span class="tag web">最新 ${f.episodes} 集</span>`;
      const date = (f.updated || '').slice(0, 10);
      return `<div class="card">
        <div class="feed-title">${esc(f.title || '未命名')}${tag}</div>
        <div class="meta">更新于 ${date}</div>
        <div class="url">${esc(url)}</div>
        <div class="row">
          <button onclick="copy('${url}')">复制订阅地址</button>
          <button class="ghost" onclick="open_('${url}')">查看</button>
        </div>
      </div>`;
    }).join('');
  } catch (e) {
    list.innerHTML = '<div class="card empty">加载失败：' + esc(e.message) + '</div>';
  }
}

function esc(s) {
  return String(s ?? '').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
}
function open_(u) { location.href = u; }

load();
</script>
</body>
</html>
