name: refresh-feeds

on:
  schedule:
    # 每天 01:00 UTC = 09:00 北京时间
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-feeds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh feeds
        run: python3 refresh.py

      - name: Commit & push changes
        run: |
          git config user.name  "xyz2rss-bot"
          git config user.email "xyz2rss@users.noreply.github.com"
          git add docs cache
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "auto: refresh feeds $(date -u +%Y-%m-%d)"
          git push
