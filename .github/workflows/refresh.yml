name: refresh-feeds

on:
  schedule:
    - cron: "17 21 * * *"      # 每天 UTC 21:17 = 北京时间 05:17
  workflow_dispatch:            # 允许手动触发

permissions:
  contents: write

concurrency:
  group: refresh-feeds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 刷新所有 RSS
        run: python3 refresh.py

      # GitHub 规则：公开仓库 60 天无活动会停用定时任务。
      # 这里每天写一次心跳文件，保证仓库始终有活动，避免 RSS 悄悄停更。
      - name: 写入心跳
        run: |
          mkdir -p docs
          date -u +"%Y-%m-%dT%H:%M:%SZ" > docs/heartbeat.txt

      - name: 提交更新
        run: |
          git config user.name  "xyz2rss-bot"
          git config user.email "xyz2rss@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "auto: refresh feeds $(date -u +%Y-%m-%d)"
            git push
          fi
